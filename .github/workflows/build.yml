name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- src/PcAiDashboard/Web/main.js
      - run: dotnet build PcAiDashboard.slnx -c Release
      - run: dotnet run --project tests/PcAiDashboard.Checks -c Release --no-build
      - run: npx playwright test
      - run: dotnet publish src/PcAiDashboard/PcAiDashboard.csproj -c Release -r win-x64 --self-contained true -o artifacts/app
      - uses: actions/upload-artifact@v4
        with:
          name: pc-ai-dashboard-win-x64
          path: artifacts/app
