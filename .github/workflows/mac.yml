name: Mac notebook build
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: ./Build-Mac.sh --verify
      - run: git diff --exit-code -- ui/web/main.js
      # Preserve the app bundle's executable bits and signature in a zip.
      - run: ditto -c -k --sequesterRsrc --keepParent 'artifacts/mac/AI Dashboard.app' artifacts/ai-dashboard-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ai-dashboard-mac
          path: artifacts/ai-dashboard-mac.zip
